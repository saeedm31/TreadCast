name: Train and publish results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "treadcast/**"
      - "requirements*.txt"
      - ".github/workflows/pipeline.yml"

concurrency: pipeline

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-train.txt
      - name: Simulate the fleet, train the models (with the 1D CNN), score them
        run: python -m treadcast --out artifacts
      - name: Keep the trained models
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            artifacts/*.pt
            artifacts/*.joblib
      - name: Commit the results the app reads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/metrics.json artifacts/predictions.csv.gz artifacts/gauges.csv artifacts/tires.csv artifacts/examples.npz
          git diff --cached --quiet || git commit -m "Update model results"
          git pull --rebase
          git push
